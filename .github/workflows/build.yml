name: Build Static Editor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev fuse3 patchelf

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build to out/temp
        run: |
          cmake -S . -B out/temp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build out/temp/build --parallel

      - name: Package AppImage
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p out/temp/AppDir/usr/bin
          mkdir -p out/temp/AppDir/usr/share/icons/hicolor/64x64/apps

          cp out/temp/build/StaticEditorCore out/temp/AppDir/usr/bin/StaticEditor
          cp assets/images/icons/Icon.png out/temp/AppDir/usr/share/icons/hicolor/64x64/apps/static-editor.png

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Static Editor' \
            'Exec=StaticEditor' \
            'Icon=static-editor' \
            'Categories=AudioVideo;Video;' \
            'Terminal=false' \
            > out/temp/AppDir/static-editor.desktop

          curl -L --fail --retry 3 -o out/temp/linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L --fail --retry 3 -o out/temp/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x out/temp/linuxdeploy.AppImage
          chmod +x out/temp/linuxdeploy-plugin-qt-x86_64.AppImage

          out/temp/linuxdeploy.AppImage \
            --appdir out/temp/AppDir \
            --executable out/temp/AppDir/usr/bin/StaticEditor \
            --desktop-file out/temp/AppDir/static-editor.desktop \
            --icon-file out/temp/AppDir/usr/share/icons/hicolor/64x64/apps/static-editor.png \
            --plugin qt \
            --output appimage

          mkdir -p "out/$VERSION"
          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          mv "$APPIMAGE" "out/$VERSION/StaticEditor-$VERSION.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaticEditor-${{ steps.version.outputs.version }}-linux-x64
          path: out/${{ steps.version.outputs.version }}/StaticEditor-${{ steps.version.outputs.version }}.AppImage

      - name: Clean out/temp
        if: always()
        run: rm -rf out/temp

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-ffmpeg

      - name: Read version
        id: version
        shell: msys2 {0}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build to out/temp
        shell: msys2 {0}
        run: |
          cmake -S . -B out/temp/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build out/temp/build --parallel

      - name: Package portable Windows build
        shell: msys2 {0}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="out/temp/portable"
          DATA="$PACKAGE/data"
          mkdir -p "$DATA"

          cp out/temp/build/StaticEditor.exe "$DATA/StaticEditor.exe"
          cp out/temp/build/StaticEditorCore.exe "$DATA/StaticEditorCore.exe"

          # windeployqt can return a non-zero status when optional Qt metadata
          # such as translations/catalogs is unavailable, even after it has
          # successfully deployed the runtime and required plugins. Treat
          # that status as a warning and validate the files we actually need.
          set +e
          windeployqt.exe \
            --release \
            --no-translations \
            --dir "$DATA" \
            "$DATA/StaticEditorCore.exe"
          WINDEPLOYQT_EXIT=$?
          set -e

          if [ "$WINDEPLOYQT_EXIT" -ne 0 ]; then
            echo "[WARN] windeployqt exited with code $WINDEPLOYQT_EXIT; continuing because optional deployment metadata is not required."
          fi

          test -f "$DATA/Qt6Core.dll"
          test -f "$DATA/Qt6Gui.dll"
          test -f "$DATA/Qt6Widgets.dll"
          test -f "$DATA/platforms/qwindows.dll"

          # Copy MinGW/FFmpeg runtime DLLs that are not always pulled in by
          # windeployqt. Keep every runtime DLL beside the executables.
          for dll in \
            avcodec-*.dll avformat-*.dll avutil-*.dll swresample-*.dll swscale-*.dll \
            libicu*.dll; do
            for source in /mingw64/bin/$dll; do
              if [ -f "$source" ]; then
                cp "$source" "$DATA/"
              fi
            done
          done

          for dll in \
            libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll \
            libfreetype-6.dll libharfbuzz-0.dll libpng16-16.dll libmd4c.dll \
            zlib1.dll libb2-1.dll libdouble-conversion.dll; do
            if [ -f "/mingw64/bin/$dll" ]; then
              cp "/mingw64/bin/$dll" "$DATA/"
            fi
          done

          find "$DATA" -mindepth 1 -maxdepth 1 -type d -name 'lib' -prune -exec rm -rf {} +

          test -f "$DATA/StaticEditor.exe"
          test -f "$DATA/StaticEditorCore.exe"

          for dll in \
            libfreetype-6.dll libharfbuzz-0.dll libpng16-16.dll libmd4c.dll \
            zlib1.dll libb2-1.dll libdouble-conversion.dll; do
            if [ ! -f "$DATA/$dll" ]; then
              echo "[ERROR] Missing required runtime DLL: $dll"
              exit 1
            fi
          done

          # ICU's DLL filename contains its ABI version (for example libicuin78.dll),
          # so do not hard-code that version in the packaging check.
          ICU_DLLS=( "$DATA"/libicuin*.dll )
          if [ ! -f "${ICU_DLLS[0]}" ]; then
            echo "[ERROR] Missing required ICU runtime DLL (libicuin*.dll)"
            exit 1
          fi
          echo "[OK] Required Qt/MinGW runtime DLLs verified"

          powershell.exe -NoProfile -Command '$shell = New-Object -ComObject WScript.Shell; $s = $shell.CreateShortcut("out/temp/portable/Static Editor.lnk"); $s.TargetPath = (Resolve-Path "out/temp/portable/data/StaticEditor.exe").Path; $s.WorkingDirectory = (Resolve-Path "out/temp/portable/data").Path; $s.Description = "Launch Static Editor"; $s.IconLocation = "$((Resolve-Path "out/temp/portable/data/StaticEditor.exe").Path),0"; $s.Save(); $s = $shell.CreateShortcut("out/temp/portable/Static Editor Debug.lnk"); $s.TargetPath = (Resolve-Path "out/temp/portable/data/StaticEditorCore.exe").Path; $s.WorkingDirectory = (Resolve-Path "out/temp/portable/data").Path; $s.Description = "Launch Static Editor Debug"; $s.IconLocation = "$((Resolve-Path "out/temp/portable/data/StaticEditorCore.exe").Path),0"; $s.Save()'

          test -f "$PACKAGE/Static Editor.lnk"
          test -f "$PACKAGE/Static Editor Debug.lnk"

          mkdir -p "out/$VERSION"
          cp -r "$PACKAGE" "out/$VERSION/StaticEditor-$VERSION-Windows-x64"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaticEditor-${{ steps.version.outputs.version }}-Windows-x64
          path: out/${{ steps.version.outputs.version }}/StaticEditor-${{ steps.version.outputs.version }}-Windows-x64

      - name: Clean out/temp
        if: always()
        shell: msys2 {0}
        run: rm -rf out/temp
