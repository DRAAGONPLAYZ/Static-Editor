name: Build Static Editor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev fuse3 patchelf

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build to out/temp
        run: |
          cmake -S . -B out/temp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build out/temp/build --parallel

      - name: Package AppImage
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p out/temp/AppDir/usr/bin
          mkdir -p out/temp/AppDir/usr/share/icons/hicolor/64x64/apps

          cp out/temp/build/StaticEditorCore out/temp/AppDir/usr/bin/StaticEditor
          cp assets/images/icons/Icon.png out/temp/AppDir/usr/share/icons/hicolor/64x64/apps/static-editor.png

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Static Editor' \
            'Exec=StaticEditor' \
            'Icon=static-editor' \
            'Categories=AudioVideo;Video;' \
            'Terminal=false' \
            > out/temp/AppDir/static-editor.desktop

          curl -L --fail --retry 3 -o out/temp/linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L --fail --retry 3 -o out/temp/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x out/temp/linuxdeploy.AppImage
          chmod +x out/temp/linuxdeploy-plugin-qt-x86_64.AppImage

          out/temp/linuxdeploy.AppImage \
            --appdir out/temp/AppDir \
            --executable out/temp/AppDir/usr/bin/StaticEditor \
            --desktop-file out/temp/AppDir/static-editor.desktop \
            --icon-file out/temp/AppDir/usr/share/icons/hicolor/64x64/apps/static-editor.png \
            --plugin qt \
            --output appimage

          mkdir -p "out/$VERSION"
          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          mv "$APPIMAGE" "out/$VERSION/StaticEditor-$VERSION.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaticEditor-${{ steps.version.outputs.version }}-linux-x64
          path: out/${{ steps.version.outputs.version }}/StaticEditor-${{ steps.version.outputs.version }}.AppImage

      - name: Clean out/temp
        if: always()
        run: rm -rf out/temp

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-ffmpeg

      - name: Read version
        id: version
        shell: msys2 {0}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build to out/temp
        shell: msys2 {0}
        run: |
          cmake -S . -B out/temp/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build out/temp/build --parallel

      - name: Package portable ZIP
        shell: msys2 {0}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p "out/temp/portable/lib"
          cp out/temp/build/StaticEditor.exe out/temp/portable/StaticEditor.exe
          cp out/temp/build/StaticEditorCore.exe out/temp/portable/StaticEditorCore.exe

          windeployqt.exe \
            --release \
            --no-translations \
            --dir out/temp/portable \
            out/temp/portable/StaticEditorCore.exe

          for dll in avcodec-*.dll avformat-*.dll avutil-*.dll swresample-*.dll swscale-*.dll libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [ -f "/mingw64/bin/$dll" ]; then
              cp "/mingw64/bin/$dll" out/temp/portable/lib/
            fi
          done

          find out/temp/portable -maxdepth 1 -type f -name '*.dll' -exec mv {} out/temp/portable/lib/ \;

          test -f out/temp/portable/StaticEditor.exe
          test -f out/temp/portable/StaticEditorCore.exe
          test -d out/temp/portable/lib
          mkdir -p "out/$VERSION"

          powershell.exe -NoProfile -Command "Compress-Archive -Path 'out/temp/portable/*' -DestinationPath 'out/$VERSION/StaticEditor-$VERSION-Windows-x64.zip' -Force"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaticEditor-${{ steps.version.outputs.version }}-windows-x64
          path: out/${{ steps.version.outputs.version }}/StaticEditor-${{ steps.version.outputs.version }}-Windows-x64.zip

      - name: Clean out/temp
        if: always()
        shell: msys2 {0}
        run: rm -rf out/temp
